<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMU 70 Mule Deer – UnitIQ Sample Scouting Map – Estimates Only</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="web_data.js"></script>
<style>html,body,#map{height:100%;margin:0;font-family:system-ui,sans-serif}
#banner{position:absolute;z-index:1000;top:8px;left:50px;right:60px;background:#fff8e1;border:1px solid #e0b000;padding:5px 10px;border-radius:6px;font-size:12.5px}
#panel{position:absolute;z-index:1000;top:62px;left:50px;background:#fff;border-radius:8px;box-shadow:0 1px 5px #0006;padding:8px 10px;font-size:12.5px;width:330px;max-height:75vh;overflow:auto}
#panel label{display:block;margin:1px 0;cursor:pointer}.hl{background:#ffe0b2;font-weight:bold;border-radius:4px}
#note{margin-top:6px;font-size:12px;border-top:1px solid #ddd;padding-top:5px}#lic{font-size:11.5px;color:#333;margin-top:4px}
.leaflet-popup-content{font-size:12.5px;max-width:330px}.leaflet-control-layers{font-size:12px;max-height:68vh;overflow:auto}
.legend{background:#fff;padding:6px 8px;border-radius:6px;font-size:11px;line-height:1.5}.sw{display:inline-block;width:12px;height:10px;margin-right:4px;vertical-align:middle}</style></head><body>
<div id="map"></div>
<div id="banner"><b>Colorado GMU 70 – Mule Deer · UnitIQ sample map</b> · Zones/heat are <b>model estimates</b>, not sightings · Ownership is approximate (not a survey) — <b>never enter, cross or shoot onto private land</b> · Verify legal access & CPW regs.</div>
<div id="panel"><b>Species</b>
<label><input type="radio" name="sp" value="deer" checked> Mule deer (buck)</label>
<div style="margin-top:6px"><b>Season (CPW 2026 statewide deer dates)</b></div><div id="seas"></div><div id="lic"></div><div id="note"></div></div>
<script>
const map=L.map('map');
const topo=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'USGS The National Map'}).addTo(map);
const img=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'USGS'});
const own={USFS:'#2e7d32',BLM:'#f9a825',ST:'#1565c0',PVT:'#9e9e9e'};
const poly=(d,c,fo=.2,w=1,da)=>L.geoJSON(d,{style:{color:c,weight:w,fillColor:c,fillOpacity:fo,dashArray:da}});
const ov={};
ov['GMU 70 boundary']=L.geoJSON(L_DATA.gmu,{style:{color:'#d50000',weight:3,fill:false}}).addTo(map);
ov['Land ownership (BLM SMA; gray = private)']=L.geoJSON(L_DATA.sma,{style:f=>({color:own[f.properties.ADMIN_AGENCY_CODE]||'#999',weight:.5,fillOpacity:.22,fillColor:own[f.properties.ADMIN_AGENCY_CODE]||'#999'})}).bindPopup(l=>'Surface agency: '+l.feature.properties.ADMIN_AGENCY_CODE+'<br><i>Approximate – not a survey.</i>').addTo(map);
ov['Access screen: orange = check, purple = likely landlocked']=L.imageOverlay('overlay_access.png',HB).addTo(map);
ov['Public land ≤1.2 km of private hay/crop (edge)']=L.imageOverlay('overlay_agedge.png',HB);
ov['Vegetation (LANDFIRE): oak/mtn shrub · sage · PJ shrub · PJ woodland · conifer/aspen · ag']=L.imageOverlay('veg.png',HB);
ov['Canopy cover ≥25% (LANDFIRE 2024)']=L.imageOverlay('canopy.png',HB);
// migration – prominent
ov['★ Mule deer migration routes (CPW)']=L.geoJSON(L_DATA.md_mig,{style:{color:'#d84315',weight:5,dashArray:'10 6'}}).bindPopup('CPW mule deer migration pattern/route');
ov['★ Mule deer migration corridors (CPW)']=poly(L_DATA.md_corr,'#ff6f00',.18,2);
ov['★ Mule deer highway crossings (CPW)']=poly(L_DATA.md_hwy,'#c51162',.45,2.5).bindPopup('CPW mule deer highway-crossing area – drive carefully at dawn/dusk');
ov['★ Utah DWR La Sal mule deer corridors (68 GPS collars, 2020–21)']=L.geoJSON(L_DATA.ut_corr,{style:f=>({color:'#6a1b9a',weight:1.5,fillColor:'#6a1b9a',fillOpacity:{'low use':.10,'medium use':.25,'high use':.4}[f.properties.migratType]||.1,dashArray:'4 3'})}).bindPopup(l=>'Utah DWR La Sal mule deer migration corridor: '+l.feature.properties.migratType);
ov['★ Utah DWR La Sal mule deer stopovers']=poly(L_DATA.ut_stop,'#4a148c',.2,1.5,'2 4');
ov['★ Elk migration routes (CPW)']=L.geoJSON(L_DATA.elk_mig,{style:{color:'#1a237e',weight:5,dashArray:'10 6'}});
ov['★ Elk migration corridors (CPW)']=poly(L_DATA.elk_corr,'#3949ab',.15,2);
ov['★ Elk highway crossings (CPW)']=poly(L_DATA.elk_hwy,'#ad1457',.45,2.5);
ov['Mule deer winter range (CPW)']=poly(L_DATA.md_winter,'#4fc3f7',.06);ov['Mule deer winter concentration (CPW)']=poly(L_DATA.md_wconc,'#0277bd',.15);
ov['Mule deer severe winter range (CPW)']=poly(L_DATA.md_severe,'#311b92',.12);ov['Mule deer concentration area (CPW)']=poly(L_DATA.md_conc,'#00897b',.18);ov['Mule deer resident pop. area (CPW)']=poly(L_DATA.md_res,'#6d4c41',.2);
ov['Elk winter range (CPW)']=poly(L_DATA.elk_winter,'#81d4fa',.06);ov['Elk winter concentration (CPW)']=poly(L_DATA.elk_wconc,'#283593',.15);ov['Elk severe winter range (CPW)']=poly(L_DATA.elk_severe,'#1a237e',.12);
ov['Perennial streams (NHD)']=L.geoJSON(L_DATA.streams,{style:{color:'#0277bd',weight:1.8}}).bindPopup(l=>l.feature.properties.gnis_name||'Perennial stream');
ov['Intermittent drainages (NHD)']=L.geoJSON(L_DATA.istreams,{style:{color:'#4fc3f7',weight:.8}});
ov['State highways (TIGER)']=L.geoJSON(L_DATA.hwy,{style:{color:'#b71c1c',weight:3}}).addTo(map);
ov['USFS MVUM roads (check Nov. dates)']=L.geoJSON(L_DATA.mvum,{style:{color:'#4e342e',weight:3}}).bindPopup(l=>{const p=l.feature.properties;return 'MVUM '+(p.id||'')+' '+(p.name||'')+'<br>'+(p.seasonal||'')+'<br>High-clearance open: '+(p.highclearancevehicle_datesopen||'n/a')}).addTo(map);
ov['County/local roads (TIGER; verify public)']=L.geoJSON(L_DATA.county,{style:{color:'#6d4c41',weight:1.5,dashArray:'4 3'}}).bindPopup(l=>(l.feature.properties.NAME||'Road')+'<br>Census TIGER – verify it is a public county road').addTo(map);
ov['Private roads/driveways (TIGER S1740) – NOT access']=L.geoJSON(L_DATA.privrd,{style:{color:'#000',weight:1.5,dashArray:'1 4'}}).bindPopup('Census TIGER private road – not public access');
ov['Trails (COTREX)']=L.geoJSON(L_DATA.trails,{style:{color:'#ad1457',weight:1.4,dashArray:'2 3'}}).bindPopup(l=>l.feature.properties.name||'Trail');
const ic=(c,t,fs=11)=>L.divIcon({className:'',html:`<div style="background:${c};color:#fff;border:2px solid #fff;border-radius:12px;padding:1px 5px;font-size:${fs}px;font-weight:bold;white-space:nowrap;box-shadow:0 0 3px #000">${t}</div>`});
const ovl=new Set(P_DATA.overlap.map(x=>x.deer||x.elk));
ov['★ Funnels / pinch points (model)']=L.layerGroup(P_DATA.funnels.map(f=>L.marker([f.lat,f.lon],{icon:ic(f.name.startsWith('Deer')?'#e65100':'#283593','▼',10)}).bindPopup(`<b>${f.name}</b> (estimate)<br>${f.why}<br>${f.near}<br>${f.elev_ft} ft · ${f.lat}, ${f.lon}<br><i>${f.access}</i>`))).addTo(map);
ov['Road enters public land (access points)']=L.layerGroup(P_DATA.access.map(s=>L.marker([s.lat,s.lon],{icon:ic('#000','A',10)}).bindPopup('<b>'+s.name+'</b><br>Confirm the road is legally public up to here.')));
ov['Saddles (DEM)']=L.layerGroup(P_DATA.saddles.map(s=>L.circleMarker([s.lat,s.lon],{radius:4,color:'#4a148c',fillOpacity:.9}).bindPopup(s.name+' · '+s.elev_ft+' ft')));
ov['Water points (NHD)']=L.layerGroup(P_DATA.water.map(s=>L.circleMarker([s.lat,s.lon],{radius:3,color:'#01579b',fillOpacity:.8}).bindPopup(s.name+'<br>Mapped; may be dry.')));
L.control.layers({'USGS Topo':topo,'USGS Imagery':img},ov,{collapsed:true}).addTo(map);
const lg=L.control({position:'bottomright'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Hotspot heat</b> <span class="sw" style="background:linear-gradient(90deg,#fed976,#fd8d3c,#bd0026)"></span>low→high (public land only)<br><span class="sw" style="background:#d84315"></span>CPW deer routes <span class="sw" style="background:#6a1b9a"></span>Utah La Sal corridors<br><span class="sw" style="background:#ff9800"></span>check access <span class="sw" style="background:#990099"></span>likely landlocked<br>▼ funnel/pinch';return d};lg.addTo(map);
const LIC={deer:{archery:'',muzzleloader:'',rifle1:'',rifle2:'',rifle3:'',rifle4:''}};
const NOTE={deer:{archery:'Model favors higher ground: aspen, oak and conifer edges near mapped water in the San Miguel / Lone Cone country on National Forest. Estimate only.',muzzleloader:'Same pattern as archery: high oakbrush/aspen and water, away from roads.',rifle1:'Deer still mostly high; pressure pushes them into oakbrush and timber away from roads.',rifle2:'Transition: the model weights CPW migration corridors and routes, the winter-range edge, and saddles. Snow timing drives how fast deer move down.',rifle3:'<b>Nov 7–15 (featured):</b> CPW says the mule deer rut peaks mid-Nov through Dec, so expect pre-rut into early rut. The model favors CPW winter range and concentration areas in PJ, sage and oakbrush, sunny gentle slopes, browse, and public land near private fields, away from roads.',rifle4:'Most deer on winter range and concentration areas; field-edge pattern strongest.'}};
let SP='deer',SE='rifle3',heat=null,zl=null;
const sdiv=document.getElementById('seas');
Object.entries(P_DATA.seasons).forEach(([k,v])=>{const l=document.createElement('label');if(k=='rifle3')l.className='hl';l.innerHTML=`<input type="radio" name="se" value="${k}" ${k=='rifle3'?'checked':''}> ${v[0]} – ${v[1]}${k=='rifle3'?' ★':''}`;sdiv.appendChild(l)});
function draw(){ if(heat)map.removeLayer(heat); if(zl)map.removeLayer(zl);
 heat=L.imageOverlay(`hot_${SP}_${SE}.png`,HB,{opacity:1}).addTo(map);
 const zs=P_DATA[SP].filter(z=>z.season==SE||(SE=='muzzleloader'&&z.season=='archery'));
 zl=L.layerGroup(zs.map(z=>L.marker([z.lat,z.lon],{icon:ic(SP=='deer'?'#bf360c':'#1a237e',z.id)}).bindPopup(`<b>${z.id} – ${SP=='deer'?'mule deer':'elk'}, ${P_DATA.seasons[z.season][0]} (estimate)</b><br>${z.owner} · ${z.elev_ft} ft · ${z.lat}, ${z.lon}<br>${z.near}<br><b>Access:</b> ${z.access}<ul style="padding-left:16px;margin:4px 0">${z.reasons.map(r=>'<li>'+r+'</li>').join('')}</ul>`))).addTo(map);
 document.getElementById('lic').innerHTML='<b>Licenses:</b> check the CPW 2026 Big Game brochure for GMU 70 hunt codes.';
 document.getElementById('note').innerHTML=NOTE[SP][SE];}
document.querySelectorAll('input[name=sp]').forEach(r=>r.onchange=e=>{SP=e.target.value;draw()});
document.querySelectorAll('input[name=se]').forEach(r=>r.onchange=e=>{SE=e.target.value;draw()});
draw(); map.fitBounds(ov['GMU 70 boundary'].getBounds());
</script></body></html>
