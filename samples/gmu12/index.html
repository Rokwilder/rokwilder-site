<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMU 12 AI Scouting Map v2 (Sample) – Estimates Only</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="web_data.js"></script>
<style>html,body,#map{height:100%;margin:0;font-family:system-ui,sans-serif}
#banner{position:absolute;z-index:1000;top:8px;left:50px;right:250px;background:#fff8e1;border:1px solid #e0b000;padding:6px 10px;border-radius:6px;font-size:12.5px}
#seas{position:absolute;z-index:1000;top:60px;left:50px;background:#fff;border-radius:8px;box-shadow:0 1px 5px #0006;padding:8px 10px;font-size:13px;max-width:330px}
#seas label{display:block;margin:2px 0;cursor:pointer}#note{margin-top:6px;font-size:12px;color:#333;border-top:1px solid #ddd;padding-top:5px}
.leaflet-popup-content{font-size:12.5px;max-width:310px}.legend{background:#fff;padding:6px 8px;border-radius:6px;font-size:11.5px;line-height:1.45}
.sw{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:middle}.leaflet-control-layers{font-size:12px;max-height:70vh;overflow:auto}</style></head><body>
<div id="map"></div>
<div id="banner"><b>Colorado GMU 12 – AI Elk Scouting Map v2 (SAMPLE)</b> · Hotspots/funnels are <b>model estimates</b>, not sightings. Ownership ≠ survey; verify legal access. No drones or live-transmitting cams for scouting (CPW W-0).</div>
<div id="seas"><b>Season (2026 CPW dates)</b><div id="radios"></div><div id="note"></div></div>
<script>
const map=L.map('map');
const topo=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'USGS The National Map'}).addTo(map);
const img=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'USGS'});
const own={USFS:'#2e7d32',BLM:'#f9a825',ST:'#1565c0',PVT:'#9e9e9e',LG:'#8d6e63'};
const poly=(d,c,fo=.2,w=1)=>L.geoJSON(d,{style:{color:c,weight:w,fillColor:c,fillOpacity:fo}});
const ov={};
ov['GMU 12 boundary']=L.geoJSON(L_DATA.gmu,{style:{color:'#d50000',weight:3,fill:false}}).addTo(map);
ov['Land ownership (BLM SMA)']=L.geoJSON(L_DATA.sma,{style:f=>({color:own[f.properties.ADMIN_AGENCY_CODE]||'#999',weight:.4,fillOpacity:.28,fillColor:own[f.properties.ADMIN_AGENCY_CODE]||'#999'})}).bindPopup(l=>'Surface agency: '+l.feature.properties.ADMIN_AGENCY_CODE+'<br><i>Not a survey.</i>').addTo(map);
ov['Possibly landlocked public land (model)']=L.imageOverlay('landlocked.png',HB,{opacity:1}).addTo(map);
ov['CPW SWA / State Trust Land']=poly(L_DATA.cpw,'#0d47a1',.35).bindPopup(l=>l.feature.properties.PropName+' ('+l.feature.properties.PropType+')<br>No corner crossing onto state land. Check CPW property rules.');
ov['★ Elk migration routes (CPW)']=L.geoJSON(L_DATA.mig,{style:{color:'#d84315',weight:4,dashArray:'8 5'}}).bindPopup('CPW elk migration route (mapped from GPS collars + staff knowledge)').addTo(map);
ov['★ Elk migration corridors (CPW)']=poly(L_DATA.corr,'#ff6f00',.14,1.5).addTo(map);
ov['★ Elk highway crossings (CPW)']=poly(L_DATA.hwy,'#c51162',.45,2).bindPopup('CPW elk highway crossing area').addTo(map);
ov['Elk summer range (CPW)']=poly(L_DATA.summer,'#43a047',.1);ov['Elk summer concentration (CPW)']=poly(L_DATA.sconc,'#1b5e20',.15);
ov['Elk winter range (CPW)']=poly(L_DATA.winter,'#4fc3f7',.15);ov['Elk winter concentration (CPW)']=poly(L_DATA.wconc,'#0277bd',.2);ov['Elk severe winter range (CPW)']=poly(L_DATA.severe,'#311b92',.2);
ov['Canopy cover ≥25% (LANDFIRE 2024)']=L.imageOverlay('canopy.png',HB,{opacity:.8});
ov['Perennial streams (NHD)']=L.geoJSON(L_DATA.streams,{style:{color:'#0288d1',weight:1.5}});
ov['USFS MVUM roads']=L.geoJSON(L_DATA.roads,{style:{color:'#4e342e',weight:3}}).bindPopup(l=>{const p=l.feature.properties;return 'MVUM '+(p.id||'')+' '+(p.name||'')+'<br>'+(p.seasonal||'')+'<br>High-clearance open: '+(p.highclearancevehicle_datesopen||'n/a')}).addTo(map);
ov['Other mapped roads (Census TIGER; public status unverified)']=L.geoJSON(L_DATA.tiger,{style:{color:'#795548',weight:1.2,dashArray:'2 3'}}).bindPopup(l=>(l.feature.properties.NAME||'Road')+'<br>Census TIGER – may be private');
ov['Trails (COTREX)']=L.geoJSON(L_DATA.trails,{style:{color:'#ad1457',weight:1.5,dashArray:'3 3'}}).bindPopup(l=>l.feature.properties.name||'Trail');
ov['Burns (MTBS)']=poly(L_DATA.burns,'#b71c1c',.25).bindPopup(l=>{const p=l.feature.properties;return p.fire_name+' fire, '+p.year});
const ic=(c,t,s=11)=>L.divIcon({className:'',html:`<div style="background:${c};color:#fff;border:2px solid #fff;border-radius:12px;padding:1px 5px;font-size:${s}px;font-weight:bold;white-space:nowrap;box-shadow:0 0 3px #000">${t}</div>`});
const fl=L.layerGroup(P_DATA.funnels.map(f=>L.marker([f.lat,f.lon],{icon:ic('#6a1b9a','▼')}).bindPopup(`<b>${f.name}</b> (estimate)<br>${f.why}<br>${f.elev_ft} ft · ${f.lat}, ${f.lon}<br><i>Access: ${f.access}</i>`))).addTo(map);
ov['★ Corridor funnels / pinch points (model)']=fl;
ov['Saddles (DEM)']=L.layerGroup(P_DATA.saddles.map(s=>L.circleMarker([s.lat,s.lon],{radius:4,color:'#4a148c',fillOpacity:.9}).bindPopup(s.name+' · '+s.elev_ft+' ft')));
ov['Benches (DEM)']=L.layerGroup(P_DATA.benches.map(s=>L.circleMarker([s.lat,s.lon],{radius:4,color:'#00695c',fillOpacity:.9}).bindPopup(s.name+' · '+s.elev_ft+' ft')));
ov['Water points (NHD)']=L.layerGroup(P_DATA.water.map(s=>L.circleMarker([s.lat,s.lon],{radius:3,color:'#01579b',fillOpacity:.8}).bindPopup(s.name+'<br>Mapped; may be dry.')));
ov['Trailheads (COTREX)']=L.layerGroup(P_DATA.access.map(s=>L.marker([s.lat,s.lon],{icon:ic('#000','TH',10)}).bindPopup('<b>'+s.name+'</b>'))).addTo(map);
L.control.layers({'USGS Topo':topo,'USGS Imagery':img},ov,{collapsed:true}).addTo(map);
const NOTES={archery:'Elk on summer range; rut peaks mid-Sept to mid-Oct. Focus: summer concentration areas, timber edges near water, high basins. <b>Confidence: high.</b>',
muzzleloader:'Same window as archery (peak rut). Uses the archery model. <b>Confidence: high.</b>',
rifle1:'Fall migration in this herd typically starts ~mid-Oct. Most elk still high; pressure pushes them into dark north-facing timber far from roads. <b>Confidence: medium.</b>',
rifle2:'Migration usually under way. Watch transition zones, corridors, saddles/funnels. Timing depends on snow. <b>Confidence: medium-low.</b>',
rifle3:'Many elk moving down or reaching winter-range edges; mild falls delay this. <b>Confidence: medium-low.</b>',
rifle4:'In normal winters most elk on winter range / concentration areas (lower, south-facing, often BLM/private mix – check access). <b>Confidence: medium.</b>'};
let hot=null,zl=null;const sc='#ef6c00';
function setSeason(k){ if(hot) map.removeLayer(hot); if(zl) map.removeLayer(zl);
 hot=L.imageOverlay('hot_'+k+'.png',HB,{opacity:.85}).addTo(map);
 const zk=k=='muzzleloader'?'archery':k;
 zl=L.layerGroup(P_DATA.zones.filter(z=>z.season==zk).map(z=>L.marker([z.lat,z.lon],{icon:ic(z.access.startsWith('LIKELY ACC')?'#2e7d32':z.access.startsWith('LIKELY LAND')?'#6a1b9a':'#ef6c00',z.id)}).bindPopup(`<b>${z.name}</b> – ${z.dates} (estimate)<br>Score ${z.score} · ${z.owner}<br>${z.lat}, ${z.lon}<br><b>Access:</b> ${z.access}<ul>${z.reasons.map(r=>'<li>'+r+'</li>').join('')}</ul>`))).addTo(map);
 document.getElementById('note').innerHTML=NOTES[k]; }
document.getElementById('radios').innerHTML=Object.entries(P_DATA.seasons).map(([k,[n,d]],i)=>`<label><input type=radio name=s value=${k} ${k=='rifle2'?'checked':''}> <b>${n}</b> – ${d}</label>`).join('');
document.querySelectorAll('input[name=s]').forEach(r=>r.onchange=e=>setSeason(e.target.value));
setSeason(new URLSearchParams(location.search).get('season')||'rifle2');
if(new URLSearchParams(location.search).get('season')) document.querySelector(`input[value=${new URLSearchParams(location.search).get('season')}]`).checked=true;
map.fitBounds(ov['GMU 12 boundary'].getBounds());
const lg=L.control({position:'bottomleft'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Zone access</b><br><span class=sw style="background:#2e7d32"></span>Likely accessible<br><span class=sw style="background:#ef6c00"></span>Check access<br><span class=sw style="background:#6a1b9a"></span>Likely landlocked<br><b>Migration</b><br><span class=sw style="background:#d84315"></span>Route <span class=sw style="background:#ff6f00;opacity:.4"></span>Corridor <span class=sw style="background:#c51162"></span>Hwy crossing<br>▼ Funnel / pinch point<br><b>Ownership</b> <span class=sw style="background:#2e7d32;opacity:.5"></span>USFS <span class=sw style="background:#f9a825;opacity:.5"></span>BLM <span class=sw style="background:#1565c0;opacity:.5"></span>State <span class=sw style="background:#9e9e9e;opacity:.5"></span>Private<br><span class=sw style="background:#990099;opacity:.5"></span>Possibly landlocked public';return d};lg.addTo(map);
</script></body></html>
